<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja Guitarra - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#/">
        <i class="bi bi-music-note-beamed accent"></i> Loja Guitarra
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Catálogo</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#/guitarras" data-route="guitarras"><i class="bi bi-vinyl me-2"></i>Guitarras</a></li>
              <li><a class="dropdown-item" href="#/marcas" data-route="marcas"><i class="bi bi-award me-2"></i>Marcas</a></li>
              <li><a class="dropdown-item" href="#/captadores" data-route="captadores"><i class="bi bi-soundwave me-2"></i>Captadores</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Pessoas</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#/clientes" data-route="clientes"><i class="bi bi-person me-2"></i>Clientes</a></li>
              <li><a class="dropdown-item" href="#/luthiers" data-route="luthiers"><i class="bi bi-tools me-2"></i>Luthiers</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Localização</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#/estados" data-route="estados"><i class="bi bi-map me-2"></i>Estados</a></li>
              <li><a class="dropdown-item" href="#/municipios" data-route="municipios"><i class="bi bi-geo-alt me-2"></i>Municípios</a></li>
            </ul>
          </li>
        </ul>
        <a class="btn btn-sm btn-outline-light" href="http://localhost:8080/q/swagger-ui" target="_blank" rel="noopener">
          <i class="bi bi-braces"></i> Swagger
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="app"></main>

  <!-- Modal do formulario (cadastro / edicao) -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="formModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="formError" class="alert alert-danger d-none"></div>
          <form id="crudForm" novalidate></form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" form="crudForm" class="btn btn-accent" id="btnSalvar">
            <i class="bi bi-check-lg"></i> Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de confirmacao de exclusao -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Confirmar exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="confirmText"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmOk">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
